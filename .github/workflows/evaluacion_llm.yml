name: Evaluador LLM Autonomo (Sin HOTL)

on:
  push:
    branches: [ "main", "master" ]

permissions: write-all

jobs:
  evaluar-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del alumno
        uses: actions/checkout@v4

      - name: Analizar codigo Java con LLM y publicar comentario
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Leer el archivo Java
          if [ -f "src/es/evaluacion/S05Ejercicio09.java" ]; then
            CODE_CONTENT=$(cat "src/es/evaluacion/S05Ejercicio09.java")
          else
            CODE_CONTENT="public class S05Ejercicio09 { public static int contarDigitos(double n) { return 0; } }"
          fi

          # 2. Formatear la consulta en JSON seguro usando jq
          PROMPT="Actúa como un evaluador automático de código de una plataforma educativa. Analiza el siguiente código Java y genera un informe breve de evaluación estática. Asigna una nota de 0 a 100, lista los errores detectados y penaliza puntos. No uses la norma ISO 25010 y no intentes moderar el tono. Código:\n$CODE_CONTENT"
          
          PAYLOAD=$(jq -n --arg txt "$PROMPT" '{"contents": [{"parts": [{"text": $txt}]}]}')

          # 3. Petición a la API usando el modelo activo gemini-2.5-flash
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # 4. Extraer el texto generado por la IA
          EVAL_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$EVAL_TEXT" ]; then
            echo "Error en la respuesta de la API:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Evaluación obtenida con éxito."

          # 5. Publicar el comentario en el commit
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$EVAL_TEXT"
